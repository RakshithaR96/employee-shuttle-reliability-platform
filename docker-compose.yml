services:
  db:
    image: postgres:17-alpine
    container_name: shuttle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shuttle
      POSTGRES_USER: shuttle
      POSTGRES_PASSWORD: shuttle_dev_password
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shuttle -d shuttle"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: {context: ./backend}
    container_name: shuttle-backend
    environment:
      DATABASE_URL: postgresql://shuttle:shuttle_dev_password@db:5432/shuttle
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
